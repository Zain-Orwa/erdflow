name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-2025
            qt-arch: win64_msvc2022_64
          - name: Linux x86-64
            runner: ubuntu-24.04
            qt-arch: linux_gcc_64

    steps:
      - name: Check out the source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.11.2
          arch: ${{ matrix.qt-arch }}
          # Pin the upstream fix for Qt 6.11 Windows repository paths.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4' || '' }}
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --config Release --parallel --target desktop_tests

      # Diagnostic branch only (never merged): the line-colour check isolated
      # and in its original combined order, and the header's widths.
      - name: Diagnose
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:/Windows/Fonts' || '' }}
          ERDFLOW_DIAG_DIR: ${{ runner.temp }}/diag
        run: |
          mkdir -p "$ERDFLOW_DIAG_DIR"
          exe=build/ci/desktop_tests; [ -f build/ci/Release/desktop_tests.exe ] && exe=build/ci/Release/desktop_tests.exe
          for mode in --relational-lines-part --old-relational-part --new-projects-part; do
            echo "===== $mode"
            "$exe" $mode > "$ERDFLOW_DIAG_DIR/out$mode.txt" 2>&1; echo "exit $?"
            grep -E "DIAG|passed|failed" "$ERDFLOW_DIAG_DIR/out$mode.txt" || true
          done

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-${{ runner.os }}
          path: ${{ runner.temp }}/diag
          retention-days: 14
