name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-2025
            qt-arch: win64_msvc2022_64

    steps:
      - name: Check out the source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.11.2
          arch: ${{ matrix.qt-arch }}
          # Pin the upstream fix for Qt 6.11 Windows repository paths.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4' || '' }}
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --config Release --parallel --target canvas_tests

      # Diagnostic branch only (never merged): the canvas suite run 30 times,
      # each with 90 s, reporting the test group it was in if it stalls.
      - name: Diagnose
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          exe=build/ci/Release/canvas_tests.exe
          stalls=0
          for i in $(seq 1 30); do
            start=$(date +%s)
            timeout 90 "$exe" > "out-$i.txt" 2>&1; code=$?
            took=$(( $(date +%s) - start ))
            last=$(grep '^\[canvas\]' "out-$i.txt" | tail -1)
            echo "run $i: exit $code in ${took}s, last: $last"
            if [ $code -ne 0 ] || [ $took -gt 25 ]; then stalls=$((stalls+1)); tail -5 "out-$i.txt"; fi
          done
          echo "runs over 25 s or failing: $stalls"
