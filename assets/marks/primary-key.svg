<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- ERDFlow's primary-key mark: a golden key held bow up, pointing down,
       with its teeth at the foot. Drawn outline-first then filled over, so
       only the outer edge of the outline shows. -->
  <defs>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.35" stop-color="#F8CD4A"/>
      <stop offset="0.75" stop-color="#E0A417"/>
      <stop offset="1" stop-color="#B97C06"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="#8A5A04" stroke="#8A5A04" stroke-width="1.6" stroke-linejoin="round">
    <path fill-rule="evenodd" d="M12 1.6a5.3 5.3 0 1 1 0 10.6a5.3 5.3 0 1 1 0-10.6z M12 4.1a1.75 1.75 0 1 0 0 3.5a1.75 1.75 0 1 0 0-3.5z"/>
    <rect x="10.35" y="10.4" width="3.3" height="12.1" rx="0.7"/>
    <rect x="12.8" y="19.1" width="4.5" height="2.5" rx="0.6"/>
    <rect x="12.8" y="15.4" width="3.4" height="2.3" rx="0.6"/>
  </g>
  <g fill="url(#gold)">
    <path fill-rule="evenodd" d="M12 1.6a5.3 5.3 0 1 1 0 10.6a5.3 5.3 0 1 1 0-10.6z M12 4.1a1.75 1.75 0 1 0 0 3.5a1.75 1.75 0 1 0 0-3.5z"/>
    <rect x="10.35" y="10.4" width="3.3" height="12.1" rx="0.7"/>
    <rect x="12.8" y="19.1" width="4.5" height="2.5" rx="0.6"/>
    <rect x="12.8" y="15.4" width="3.4" height="2.3" rx="0.6"/>
  </g>
  <path d="M8.2 5.2a4.1 4.1 0 0 1 3.3-2.4" fill="none" stroke="url(#shine)" stroke-width="1.3" stroke-linecap="round"/>
</svg>
